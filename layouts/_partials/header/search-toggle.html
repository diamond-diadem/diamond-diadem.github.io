{{/*
  Button opening the search modal (wired up by search-modal.js).

  Context: dict with
    id    - element id looked up by search-modal.js (string)
    class - CSS classes for the button (string)
    label - optional visible text shown after the icon (string)
*/}}
<button type="button" id="{{ .id }}" class="{{ .class }}" aria-label="{{ i18n "search_website" }}">
  <svg xmlns="http://www.w3.org/2000/svg" class="icon icon-tabler icon-tabler-search" width="24" height="24" viewBox="0 0 24 24" stroke-width="2" stroke="currentColor" fill="none" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
    <path stroke="none" d="M0 0h24v24H0z" fill="none"></path>
    <circle cx="10" cy="10" r="7"></circle>
    <line x1="21" y1="21" x2="15" y2="15"></line>
  </svg>
  {{- with .label }}
  <span>{{ . }}</span>
  {{- end }}
</button>
