{{- /*
  Renders a reading page: the page header across the top, then the text at a
  comfortable measure with the contents rail beside it.

  @param {page} . The page to render.
*/ -}}
<main class="diamond-content">
  <div class="container-fw article-column mx-auto">
    <article class="article-layout">
      {{ partial "main/page-header.html" . }}
      {{ partial "main/article-split.html" (dict "page" .) }}
    </article>
  </div>
</main>
