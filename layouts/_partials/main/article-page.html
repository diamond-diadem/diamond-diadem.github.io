{{- /*
  Renders a single-column reading page: the page header, then its content,
  centered at a comfortable reading width.

  @param {page} . The page to render.
*/ -}}
<main class="diamond-content">
  <div class="container-fw mx-auto">
    <div class="row justify-content-center">
      <article class="col-lg-11 col-xl-9">
        {{ partial "main/page-header.html" . }}
        {{ .Content }}
      </article>
    </div>
  </div>
</main>
