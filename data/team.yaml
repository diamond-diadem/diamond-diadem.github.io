  bio_short: I work at the intersection of machine learning and experimental physics, focusing on LIBS data for materials science.
  bio_short_fr: Je travaille à l’intersection de l’apprentissage automatique et de la physique expérimentale, en me concentrant sur les données LIBS pour la science des matériaux.
  bio_long: |-
    I am a research engineer working on machine learning methods for scientific applications, with a focus on LIBS (Laser-Induced Breakdown Spectroscopy) data within the DIAMOND project.

    - Interests: machine learning for science, LIBS spectroscopy, scientific computing.
    - Background: computer engineering, specialised in AI and data analytics.
    - Tools: Python, PyTorch, scientific computing.
  bio_long_fr: |-
    Je suis ingénieur de recherche et je travaille sur des méthodes d’apprentissage automatique appliquées aux sciences, en particulier aux données LIBS (spectroscopie sur plasma induit par laser) dans le cadre du projet DIAMOND.

    - Centres d’intérêt : apprentissage automatique pour les sciences, spectroscopie LIBS, calcul scientifique.
    - Formation : ingénierie informatique, spécialisation en IA et analyse de données.
    - Outils : Python, PyTorch, calcul scientifique.
  links:
    - label: LinkedIn
      url: https://www.linkedin.com/in/gabriele-cassetta/
  orcid: 0009-0006-2277-0622
  github: merhametsize
