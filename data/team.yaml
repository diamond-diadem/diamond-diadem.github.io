  photo: /images/team/jpam.png
  bio_short: I work with bio-inspired and machine learning algorithms, applying them to materials science.
  bio_short_fr: Je travaille avec des algorithmes bio-inspirés et d’apprentissage automatique, que j’applique à la science des matériaux.
  bio_long: |-
    I work with bio-inspired and machine learning algorithms, applying them to materials science, and to other complex systems just for fun.

    - Interests: DFT, MLIPs, nanoparticles and nanoclusters, bio-inspired optimisation.
    - One of my most entertaining papers: [Modeling a Hypothetical Zombie Outbreak Can Save Us from Real-World Monsters](https://link.springer.com/article/10.1007/s00283-019-09893-9).
    - Tutorial notebooks: [in my GitHub repository](https://github.com/jpalastus/Notebooks).
  bio_long_fr: |-
    Je travaille avec des algorithmes bio-inspirés et d’apprentissage automatique, que j’applique à la science des matériaux, et à d’autres systèmes complexes pour le plaisir.

    - Centres d’intérêt : DFT, MLIPs, nanoparticules et nanoclusters, optimisation bio-inspirée.
    - L’une de mes publications les plus amusantes : [Modeling a Hypothetical Zombie Outbreak Can Save Us from Real-World Monsters](https://link.springer.com/article/10.1007/s00283-019-09893-9).
    - Notebooks de tutoriels : [dans mon dépôt GitHub](https://github.com/jpalastus/Notebooks).
