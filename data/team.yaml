  bio_short: I am a specialist in materials simulation using high-performance computing.
  bio_short_fr: Je suis spécialiste de la simulation des matériaux par le calcul haute performance.
  bio_long: |-
    I am a specialist in materials simulation using high-performance computing (HPC). I direct the MEM laboratory (Modelling and Exploration of Materials), whose teams specialise in advanced characterisation and simulation of materials, from the quantum scale up to biology.

    - Interests: DFT, HPC, quantum mechanics.
  bio_long_fr: |-
    Je suis spécialiste de la simulation des matériaux par le calcul haute performance (HPC). Je dirige le laboratoire MEM (Modélisation et Exploration des Matériaux), qui regroupe des équipes spécialistes de la caractérisation avancée et de la simulation des matériaux, du quantique jusqu’à la biologie.

    - Centres d’intérêt : DFT, HPC, mécanique quantique.
