main:
  # Services: a dropdown of two columns; each child shows its icon and
  # description, and new children fill the grid row by row.
  - name: Services
    identifier: services-en
    weight: 10
  - name: Codes
    pageRef: /codes
    parent: services-en
    weight: 11
    params:
      icon: tabler-icons/outline/box
      description: Ready-to-run containers of the codes you use.
  - name: Workflows
    pageRef: /workflows
    parent: services-en
    weight: 12
    params:
      icon: tabler-icons/outline/route
      description: Automated, traceable simulation pipelines.
  - name: Data
    pageRef: /data
    parent: services-en
    weight: 13
    params:
      icon: tabler-icons/outline/database
      description: Store, link and share your materials data.
  - name: ML notebooks
    pageRef: /notebooks
    parent: services-en
    weight: 14
    params:
      icon: tabler-icons/outline/notebook
      description: Machine learning applied to materials data.
  - name: Documentation
    url: en/documentation/
    weight: 50
  - name: Contact
    url: en/contact/
    weight: 60
  - name: About
    url: en/about/diamond/
    weight: 70
    identifier: about-en

